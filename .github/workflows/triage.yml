name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    # Configure this environment's PI_AUTH_JSON before enabling the workflow.
    environment: pi-oauth
    concurrency:
      group: pi-oauth-auth-json
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Classify issue
        id: triage
        uses: ./triage
        with:
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          auth-output: ${{ runner.temp }}/pi-triage-auth/auth.json
          provider: openai
          model: gpt-6.1-sol
          thinking: medium

      - name: Persist refreshed credentials
        if: always() && steps.triage.outcome != 'skipped'
        uses: ./persist-auth
        with:
          auth-file: ${{ runner.temp }}/pi-triage-auth/auth.json
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          token: ${{ secrets.PAT_TOKEN }}
